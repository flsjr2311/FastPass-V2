# Configuração Mosquitto para DESENVOLVIMENTO / captura de tráfego na LAN.
# NÃO use em produção: aceita conexões anônimas e sem TLS.
#
# Uso:
#   "C:\Program Files\mosquitto\mosquitto.exe" -v -c tools\mqtt\mosquitto-dev.conf
#
# A catraca Indium deve ser configurada (tela MQTT) com:
#   Conexão : customizado / definir manual
#   Broker  : 192.168.15.166   (IP deste notebook na LAN)
#   Port    : 1883
#   TLS     : desmarcado
#   Facility ID / Device ID : ex. fastpass / catraca1

# Escuta em todas as interfaces de rede (para a placa na LAN alcançar).
listener 1883 0.0.0.0

# Ambiente de desenvolvimento: permite clientes sem usuário/senha.
allow_anonymous true

# Log detalhado no console (útil para ver a placa conectando/assinando).
log_type all
connection_messages true
log_timestamp true
